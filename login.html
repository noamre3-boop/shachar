<body class="login-page">
<div class="ln" data-login>

  <!-- the sign-in side -->
  <main class="ln-form">
    <div class="ln-brand intro-fade">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="2.9" r="1.7"/><path d="M16 4.4v4" stroke="#000" stroke-width="1.6"/><path d="M4.2 6.2 9.6 9.4a13 13 0 0 1 12.8 0l5.4-3.2V19a11.8 11.8 0 0 1-23.6 0z"/><rect x="7.6" y="12.2" width="16.8" height="10.6" rx="5.3" fill="#fff"/><ellipse cx="12.7" cy="17.5" rx="1.9" ry="2.2"/><ellipse cx="19.3" cy="17.5" rx="1.9" ry="2.2"/></svg>
      <span style="display:flex;align-items:center;gap:9px"><span class="brand-word">שחר</span></span>
    </div>

    <section class="ln-card" aria-labelledby="login-h">
      <p class="ln-kicker intro-rise">ברוכים הבאים</p>
      <h1 id="login-h" class="intro-rise d1">נעים להכיר,<br>אני שחר.</h1>
      <p class="ln-lead intro-rise d2">עוזר ה-AI והלמידה של המכללה. שואלים כל דבר, לומדים בקצב ובסגנון שלכם, ושחר זוכר איפה עצרתם.</p>

      <div class="ln-actions intro-rise d3">
        <button class="g-btn" type="button" data-google>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span>המשך עם Google</span>
        </button>
        <div class="or"><span>או</span></div>
        <button class="guest-btn" type="button" data-guest>כניסה כאורח</button>
      </div>

      <p class="fine intro-rise d4"><i data-i="lock"></i><span>מ-Google נלקחים רק השם, כתובת המייל והתמונה. הזיכרון וההתקדמות נשמרים במכשיר שלך.</span></p>
    </section>

    <p class="ln-foot"><a class="by-noam" href="https://github.com/noamre3-boop" target="_blank" rel="noopener noreferrer" dir="ltr">by Noam</a> · אב-טיפוס להמחשה</p>
  </main>

  <!-- the scene: only Shachar, on a glossy floor that ripples like water under the mouse -->
  <aside class="ln-art" aria-hidden="true" data-art>
    <span class="ln-horizon"></span>
    <canvas class="ln-water" data-water></canvas>
    <div class="ln-hero owl-live" data-owl>
      <div class="owl-tilt">
        <img class="owl-body" src="assets/img/owl-noeyes.webp" alt="" width="400" height="400">
        <span class="owl-eye" style="--x:40%"></span>
        <span class="owl-eye" style="--x:59.9%"></span>
        <span class="owl-sheen"></span>
        <span class="ln-badge" data-badge><img src="assets/img/achva-mark.webp" alt="" width="209" height="240"></span>
      </div>
    </div>
  </aside>
</div>

<script src="assets/js/core.js"></script>
